<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="cpt-l-bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="cpt-l-mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="cpt-l-cyan" x1="720" y1="70" x2="1140" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cpt-l-violet" x1="720" y1="210" x2="1140" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="cpt-l-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Surface -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#cpt-l-bg)" stroke="#CBD5E1" stroke-width="1.5"/>
  <ellipse cx="940" cy="140" rx="230" ry="120" fill="url(#cpt-l-glow)"/>

  <!-- Subtle Right Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.18" stroke-width="1">
    <line x1="720" y1="60" x2="1148" y2="60"/>
    <line x1="720" y1="220" x2="1148" y2="220"/>
    <line x1="780" y1="36" x2="780" y2="244"/>
    <line x1="900" y1="36" x2="900" y2="244"/>
    <line x1="1020" y1="36" x2="1020" y2="244"/>
    <line x1="1140" y1="36" x2="1140" y2="244"/>
  </g>

  <!-- Left: Brand Mark -->
  <g transform="translate(52, 54)">
    <rect width="64" height="64" rx="14" fill="url(#cpt-l-mark)"/>
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="12" y1="32" x2="52" y2="32" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M12 22 C19 14, 25 46, 32 32 C39 18, 45 38, 52 32" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M12 42 C19 50, 25 18, 32 32 C39 46, 45 26, 52 32" stroke="#A78BFA" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="3.2" fill="#F8FAFC"/>
    <circle cx="52" cy="32" r="3.2" fill="#22D3EE"/>
  </g>

  <!-- Left: Typography -->
  <text x="136" y="98" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em">Crypto Pair Trading</text>
  <text x="52" y="156" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500">Event-driven statistical arbitrage unifying backtest &amp; live execution</text>

  <!-- Left: Tech Pill -->
  <rect x="52" y="188" width="332" height="34" rx="17" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2"/>
  <circle cx="72" cy="205" r="4" fill="#06B6D4"/>
  <text x="86" y="210" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">Python 3.13+  •  Numba JIT  •  Binance</text>

  <!-- Right: Cointegrated Dual Waves Artwork -->
  <!-- ±2σ Band -->
  <rect x="720" y="76" width="428" height="128" rx="8" fill="#06B6D4" fill-opacity="0.04"/>
  <line x1="720" y1="76" x2="1148" y2="76" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="720" y1="204" x2="1148" y2="204" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Mean Equilibrium Line -->
  <line x1="720" y1="140" x2="1148" y2="140" stroke="#64748B" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Spread Vertical Connectors -->
  <g stroke="#0891B2" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="792" y1="88" x2="792" y2="192"/>
    <line x1="934" y1="100" x2="934" y2="180"/>
    <line x1="1064" y1="114" x2="1064" y2="166"/>
  </g>

  <!-- Dual Cointegrated Waves -->
  <path d="M724 108 C760 66, 816 208, 864 140 C912 72, 964 198, 1012 140 C1054 90, 1094 172, 1140 140" stroke="url(#cpt-l-cyan)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M724 172 C760 214, 816 72, 864 140 C912 208, 964 82, 1012 140 C1054 190, 1094 108, 1140 140" stroke="url(#cpt-l-violet)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Convergence & Peak Nodes -->
  <circle cx="864" cy="140" r="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2.8"/>
  <circle cx="1012" cy="140" r="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.8"/>
  <circle cx="1140" cy="140" r="7" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="792" cy="91" r="4" fill="#06B6D4"/>
  <circle cx="792" cy="189" r="4" fill="#7C3AED"/>
</svg>
